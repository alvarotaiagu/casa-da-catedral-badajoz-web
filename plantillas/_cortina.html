<div class="cortina" id="cortina" aria-hidden="true">
  <div class="cortina__capa" id="cortina-capa">
    <div class="cortina__dentro" id="cortina-dentro">
      <div class="cortina__torre">{{torre-cortina}}</div>
      <p class="cortina__nombre">Casa da Catedral</p>
    </div>
    <svg class="cortina__borde" viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true"><path id="cortina-borde" d="M0 0H100V0.01Q50 0.01 0 0.01Z"/></svg>
  </div>
  <div class="cortina__cuelga" id="cortina-llavero">
    <span class="cortina__cordel"></span>
    {{llavero-cortina}}
  </div>
</div>
